<!DOCTYPE html>
<html>
    <head lang="tr">
        <meta charset="utf-8">
        <title>Nisanur Yaldız Resmi Web Sitesi</title>
        <meta name="description" content="Nisanur Yaldız Resmi Web Sitesi">
        <meta name="keywords" content="olivia, olivia rodrigo, sour, guts, müzik, öneri,">
        <style>
            *{
                margin: 0px;
                padding: 0px;
            }
            /*Banner*/
            #banner{
                height: 70px;
                border-style:dashed;
                border-width: 0px 0px 3px 0px;
                background-color:lightpink;
            }
            #isim{
                color:black;
                font-style: italic;
                font-family:Georgia, 'Times New Roman', Times, serif;
                text-align: center;
                top: 10px;
            }
            /*AnaMenü*/
            #anamenu{
                height: 55px;
                border-style: none;
                border-width: 0px;
                background-color:lightpink;
                margin:auto;
            }
            #anamenu ul{
                list-style-type: none;
                align-items: center;
                justify-content: center;

            }
            #anamenu ul li{
                width: 80px;
                border-style: solid;
                border-width: 3px;
                border-radius: 8px;
                border-color: lightpink;
                background-color:lightpink;
                float: left;
                padding: 4px;
                position: relative;
                top: 10px;
                text-align: center;
            }
            #anamenu ul a{
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                text-decoration: none;
                font-weight: bold;
                font-size: 12px;
            }
            #anamenu ul a:link{
                color:aliceblue;
            }
            #anamenu ul a:visited{
                color:aliceblue;
            }
            #anamenu ul a:hover{
                color:lightgray;
                text-decoration: underline;
            }
            /*İçerik Bölümü*/
            #içerik{
                height: 520px;
                background-color:lightpink;
                border-width: 3px 0px 0px 0px;
                border-style: dashed;
                display: block; /*öğelerin doğal akışta gelmesini sğlar*/
                position: relative;
                overflow-y: auto;
                max-height: 520px;
                padding-bottom: 20px;
            }
            #içerik h2{
                font-family:Georgia, 'Times New Roman', Times, serif;
                font-style: oblique;
                margin-left: 40px;
                margin-top: 20px;
                margin-bottom: 15px;
            }
            #içerik p{
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                font-style: oblique;
                margin-left: 40px;
                margin-bottom: 20px;
                
            }
            #oliviarodrigo{
                margin-left: 80px;
                display: flex;
                flex-wrap: wrap;
                gap:50px;
                justify-content: flex-start;
            }
            /*Altmenu bölümü*/
            #altmenu{
                height: 80px;
                background-color: lightpink;
                border-style: dashed;
                border-width: 3px 0px 0px 0px;
            }
            #altmenu ul img{
                width: 50px;
                height: 50px;
                float: left;
                position: relative;
                padding: 4px;
                top: 10px;
                border-radius: 30px;
                background-color: lightpink;
            }
            #altmenu ul {
                list-style-type: none;
                display: flex;
                padding: 0px;
                background-color: lightpink;
                align-items: center;
                justify-content: center;
            }

        </style>
    </head>
    <body>
        <div id="sayfa">
            <header id="banner">
                <h1 id="isim">Nisanur Yaldız</h1>
            </header>
            
            <nav id="anamenu">
                <ul>
                    <li><a href="index.html">AnaSayfa</a></li>
                    <li><a href="cv.html">Özgeçmiş</a></li>
                    <li><a href="ankara.html">Ankara</a></li>
                    <li><a href="ankaragücü.html">AnkaraGücü</a></li>
                    <li><a href="müzik.html">Müzik</a></li>
                    <li><a href="iletisim.html">İletişim</a></li>
                </ul>
            </nav>

            <article id="içerik">
                <h2>Olivia Rodrigo</h2>
                <p>Hem severek dinlediğim hem de web sitemi tasarlarken onun sitesinden ilham aldığım sanatçı 
                    ve işte size önerebileceğim 10 güzel şarkısı:
                </p>
                <div id="oliviarodrigo"></div>
                <script>
                async function getSongs() {
                    const response = await fetch("https://itunes.apple.com/search?term=olivia+rodrigo&entity=musicTrack&limit=10");
                    const data = await response.json();
                    const container = document.getElementById("oliviarodrigo");
                    container.innerHTML = "";
                    data.results.forEach(song => {
                    const item = document.createElement("div");
                    item.innerHTML = `
                      <p><strong>${song.trackName}</strong> - ${song.artistName}</p>
                      <audio controls src="${song.previewUrl}"></audio>
      `               ;
                      container.appendChild(item);
                    });
                }
                getSongs();
                </script>
                
            </article>

            <footer id="altmenu">
                <ul>
                    <li><a href="https://instagram.com"><img src="resimmlerr/instagramlogo.png"></a></li>
                    <li><a href="https://WhatsApp.com"><img src="resimmlerr/whatsapp.png"></a></li>
                    <li><a href="https://spotify.com"><img src="resimmlerr/spotify.png"></a></li>
                </ul>
            </footer>
        </div>
    </body>
</html>
