<!DOCTYPE html>
<html>
    <head lang="tr">

        ,cv,özgeçmiş,">
        <style>
            *{
                margin: 0px;
                padding: 0px;
            }
            #sayfa{
                width: 465px;
                min-height: 600px;
                border-style: solid;
                border-width: 0px;
                margin: auto;
            }
            /*Banner*/
            #banner{
                width: 465px;
                height: 70px;
                border-style:dotted;
                border-width: 1px;
                background-color:darkmagenta;
                margin: auto;
            }
            #isim{
                color:aliceblue;
                font-style: italic;
                font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
                text-align: center;
                top: 25px;
            }
            /*AnaMenü*/
            #anamenu{
                width: 465px;
                height: 50px;
                border-style: none;
                border-width: 0px;
                background-color:darkmagenta;
                margin: auto;
            }
            #anamenu ul{
                list-style-type: none;
            }
            #anamenu ul li{
                width: 80px;
                border-style: solid;
                border-width: 3px;
                border-radius: 8px;
                border-color: darkmagenta;
                background-color:darkmagenta;
                float: left;
                padding: 4px;
                position: relative;
                top: 10px;
                text-align: center;
            }
            #anamenu ul a{
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                text-decoration: none;
                font-weight: bold;
                font-size: 12px;
            }
            #anamenu ul a:link{
                color:aliceblue;
            }
            #anamenu ul a:visited{
                color:aliceblue;
            }
            #anamenu ul a:hover{
                color:lightgray;
                text-decoration: underline;
            }

        </style>
    </head>
    <body>
        <div id="sayfa">
