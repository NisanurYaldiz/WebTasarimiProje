<!DOCTYPE html>

    <head lang="tr">

        <style>
            *{
                margin: 0px;
                padding: 0px;
            }
            #sayfa{
                margin: auto;
            }
            /*Banner*/
            #banner{
                height: 70px;
                border-style:dashed;
                border-width: 0px 0px 3px 0px;
                background-color:hotpink;
            }
            #isim{
                color:aliceblue;
                font-style: italic;
                font-family:Georgia, 'Times New Roman', Times, serif;
                text-align: center;
                top: 10px;
            }
            /*AnaMenü*/
            #anamenu{
                height: 55px;
                border-style: none;
                border-width: 0px;
                background-color:hotpink;
                margin:auto;
            }
            #anamenu ul{
                list-style-type: none;
                align-items: center;
                justify-content: center;

            }
            #anamenu ul li{
                width: 80px;
                border-style: solid;
                border-width: 3px;
                border-radius: 8px;
                border-color: hotpink;
                background-color:hotpink;
                float: left;
                padding: 4px;
                position: relative;
                top: 10px;
                text-align: center;
            }
            #anamenu ul a{
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                text-decoration: none;
                font-weight: bold;
                font-size: 12px;
            }
            #anamenu ul a:link{
                color:aliceblue;
            }
            #anamenu ul a:visited{
                color:aliceblue;
            }
            #anamenu ul a:hover{
                color:lightgray;
                text-decoration: underline;
            }
            /*İçerik Bölümü*/
            #içerik{
                height: 520px;
                background-color:hotpink;
                border-width: 3px 0px 0px 0px;
                border-style: dashed;
            }
            /*Altmenu bölümü*/
            #altmenu{
                height: 80px;
                background-color: hotpink;
                border-style: dashed;
                border-width: 3px 0px 0px 0px;
            }
            #altmenu ul img{
                width: 50px;
                height: 50px;
                float: left;
                position: relative;
                padding: 4px;
                top: 10px;
                border-radius: 30px;
                background-color: hotpink;
            }
            #altmenu ul {
                list-style-type: none;
                display: flex;
                padding: 0px;
                background-color: hotpink;
                align-items: center;
                justify-content: center;
            }

        </style>
    </head>
    <body>
        <div id="sayfa">

            <nav id="anamenu">
